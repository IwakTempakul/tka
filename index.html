<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackboard Letter Display — Pro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Share+Tech+Mono&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    background:linear-gradient(160deg,#d8d2c2 0%,#c9c1ad 40%,#b8ae98 100%);
    font-family:"Fredoka",system-ui,sans-serif;
    color:#1e1e1e;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    width:100vw;height:100vh;
    display:flex;flex-direction:column;
    padding:1.8vh 2vw 1.6vh;
    position:relative;
  }

  .stage:before{
    content:"";
    position:absolute;inset:0;
    pointer-events:none;opacity:.12;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .topbar{
    height:16.5%;
    display:grid;
    grid-template-columns:1fr 2.6fr 1fr;
    align-items:center;
    gap:1.2vw;
    position:relative;z-index:2;
  }

  .clock-wrap,.calendar{
    height:92%;
    display:flex;align-items:center;justify-content:center;
  }

  .clock{
    width:min(9.8vw,128px);
    aspect-ratio:1;
    position:relative;
    filter:drop-shadow(2px 3px 0 rgba(30,30,30,.2));
  }
  .analog-face{width:100%;height:100%;display:block;overflow:visible}
  .face-ring{
    fill:#f5f0e0;
    stroke:#1e1e1e;
    stroke-width:3.4;
    vector-effect:non-scaling-stroke;
  }
  .face-inner{
    fill:none;stroke:#1e1e1e;stroke-width:1;opacity:.15;
    vector-effect:non-scaling-stroke;
  }
  .tick{stroke:#1e1e1e;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .tick.major{stroke-width:2.2}
  .tick.minor{stroke-width:1;opacity:.65}
  .clock-number{
    fill:#1e1e1e;
    font-family:Arial,sans-serif;
    font-size:8.2px;font-weight:900;
    text-anchor:middle;dominant-baseline:middle;
  }
  .clock-hand{transform-origin:50px 50px;transform-box:view-box}
  .hour-hand{stroke:#1e1e1e;stroke-width:4.2;stroke-linecap:round}
  .minute-hand{stroke:#1e1e1e;stroke-width:2.6;stroke-linecap:round}
  .second-hand{stroke:#c41e1e;stroke-width:1.4;stroke-linecap:round}
  .hand-tail{stroke:#1e1e1e;stroke-width:2.6;stroke-linecap:round}
  .center-ring{fill:#f5f0e0;stroke:#1e1e1e;stroke-width:1.9}
  .center-dot{fill:#c41e1e}

  .title{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    transform:rotate(-.4deg);
  }
  .digital-clock{
    font-family:"Share Tech Mono","Courier New",monospace;
    font-size:clamp(24px,3.1vw,46px);
    color:#c41e1e;
    letter-spacing:.08em;
    line-height:1;
    margin-bottom:.28em;
    text-shadow:
      0 0 8px rgba(196,30,30,.35),
      0 0 2px rgba(196,30,30,.2);
  }
  .title-text{
    font-size:clamp(14px,1.85vw,27px);
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#1e1e1e;
    border-bottom:3px solid #1e1e1e;
    padding:0 .75em .12em;
    position:relative;
  }

  .calendar{
    flex-direction:column;font-weight:700;
    transform:rotate(.8deg);
    text-align:center;
  }
  .cal-label{font-size:clamp(10px,.95vw,14px);letter-spacing:.18em;opacity:.8}
  .date{font-size:clamp(24px,3.1vw,44px);line-height:1;margin:.05em 0}
  .monthyear{font-size:clamp(11px,1.15vw,17px);letter-spacing:.06em;opacity:.85}

  .board{
    flex:1;min-height:0;
    background:
      radial-gradient(ellipse at 25% 20%,rgba(255,255,255,.06),transparent 40%),
      radial-gradient(ellipse at 75% 80%,rgba(255,255,255,.04),transparent 35%),
      linear-gradient(165deg,#1a2824 0%,#16221e 50%,#13201c 100%);
    border:clamp(6px,.6vw,10px) solid #6b4f35;
    border-radius:10px;
    box-shadow:
      inset 0 0 0 3px #9c7a52,
      inset 0 0 50px rgba(0,0,0,.55),
      0 12px 28px rgba(0,0,0,.25),
      5px 7px 0 rgba(30,30,30,.15);
    position:relative;
    display:flex;align-items:flex-start;justify-content:center;
    padding-top:clamp(28px,5.5vh,52px);
    overflow:hidden;
  }
  .board:before{
    content:"";
    position:absolute;inset:0;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E");
    opacity:.35;
    pointer-events:none;
    mix-blend-mode:overlay;
  }
  .board:after{
    content:"";
    position:absolute;inset:0;
    background:repeating-linear-gradient(
      0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px
    );
    pointer-events:none;
  }

  .board-label{
    position:absolute;top:3.2%;left:3%;
    color:#c8c9bf;
    font-size:clamp(9px,.85vw,13px);
    letter-spacing:.2em;
    opacity:.55;
    transform:rotate(-1deg);
    font-weight:500;
  }

  .letters{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(12px,2.4vw,42px);
    width:88%;
    position:relative;z-index:1;
  }
  .letter{
    width:calc(clamp(52px,7.8vw,138px) * var(--letter-scale,1));
    aspect-ratio:.78;
    display:flex;align-items:center;justify-content:center;
    color:#f4f1e4;
    font-family:"Fredoka","Comic Sans MS",cursive;
    font-size:calc(clamp(48px,7vw,120px) * var(--letter-scale,1));
    font-weight:700;
    text-shadow:
      0 0 12px rgba(255,255,255,.15),
      1px 1px 0 rgba(255,255,255,.12),
      0 2px 4px rgba(0,0,0,.3);
    position:relative;
    transform:rotate(-1deg);
    transition:font-size .2s cubic-bezier(.34,1.2,.64,1),
               width .2s cubic-bezier(.34,1.2,.64,1),
               transform .25s ease,
               opacity .2s ease;
    animation:letterIn .35s cubic-bezier(.34,1.4,.64,1) both;
    --water: 100%;
  }
  .letter:nth-child(1){animation-delay:.02s}
  .letter:nth-child(2){transform:rotate(1.3deg);animation-delay:.05s}
  .letter:nth-child(3){transform:rotate(-1.7deg);animation-delay:.08s}
  .letter:nth-child(4){transform:rotate(.9deg);animation-delay:.11s}
  .letter:nth-child(5){transform:rotate(-.7deg);animation-delay:.14s}
  .letter:nth-child(6){transform:rotate(1.4deg);animation-delay:.17s}

  @keyframes letterIn{
    from{opacity:0;transform:scale(.6) translateY(12px)}
    to{opacity:1}
  }

  .letter:after{
    content:"";
    position:absolute;
    width:78%;height:5px;
    left:11%;bottom:7%;
    background:rgba(255,255,255,.09);
    border-radius:2px;
    transform:rotate(-2deg);
    filter:blur(.8px);
  }

  /* Surface air: rose pink di bawah, putih di atas; --water = tinggi permukaan */
  .letter.water-active{
    color:transparent;
    text-shadow:none;
    background-image:linear-gradient(
      to top,
      #c2185b 0%,
      #e91e63 calc(var(--water) - 4%),
      #f48fb1 calc(var(--water) - 1%),
      #fce4ec var(--water),
      #f4f1e4 var(--water),
      #f4f1e4 100%
    );
    -webkit-background-clip:text;
    background-clip:text;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
  }
  .letter.water-active:after{
    background:rgba(233,30,99,.28);
  }

  .size-control{
    position:absolute;
    top:2.6%;right:2.4%;
    display:flex;align-items:center;gap:4px;
    z-index:3;
    background:rgba(0,0,0,.25);
    padding:4px 7px 4px 9px;
    border-radius:20px;
    border:1px solid rgba(200,201,191,.2);
    backdrop-filter:blur(4px);
  }
  .size-label{
    color:#c8c9bf;
    font-family:"Share Tech Mono",monospace;
    font-size:clamp(8px,.72vw,11px);
    letter-spacing:.08em;
    opacity:.7;
    margin-right:2px;
  }
  .size-btn{
    width:clamp(20px,2vw,28px);
    height:clamp(20px,2vw,28px);
    appearance:none;border:none;
    background:rgba(255,255,255,.1);
    color:#e8e6d9;
    border-radius:50%;
    font-size:clamp(11px,1.15vw,15px);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,transform .1s;
    line-height:1;padding:0;
  }
  .size-btn:hover{background:rgba(255,255,255,.22)}
  .size-btn:active{transform:scale(.88);background:rgba(255,255,255,.3)}

  @media(max-width:900px){
    .clock{width:9vw}
    .stage{padding:1vh 1.2vw}
    .topbar{height:15%}
  }
</style>
</head>
<body>
<div class="stage">
  <header class="topbar">
    <div class="clock-wrap">
      <div class="clock" aria-label="Jam analog realtime">
        <svg class="analog-face" viewBox="0 0 100 100" role="img">
          <circle class="face-ring" cx="50" cy="50" r="47"></circle>
          <circle class="face-inner" cx="50" cy="50" r="42.5"></circle>
          <g id="clockTicks"></g>
          <g id="clockNumbers"></g>
          <g id="hourHand" class="clock-hand">
            <line class="hour-hand" x1="50" y1="50" x2="50" y2="28"></line>
            <line class="hand-tail" x1="50" y1="50" x2="50" y2="54"></line>
          </g>
          <g id="minuteHand" class="clock-hand">
            <line class="minute-hand" x1="50" y1="50" x2="50" y2="19"></line>
            <line class="hand-tail" x1="50" y1="50" x2="50" y2="53"></line>
          </g>
          <g id="secondHand" class="clock-hand">
            <line class="second-hand" x1="50" y1="50" x2="50" y2="14"></line>
            <line class="second-hand" x1="50" y1="50" x2="50" y2="56"></line>
          </g>
          <circle class="center-ring" cx="50" cy="50" r="3.3"></circle>
          <circle class="center-dot" cx="50" cy="50" r="1.4"></circle>
        </svg>
      </div>
    </div>

    <div class="title">
      <div class="digital-clock" id="digitalClock">00:00:00</div>
      <div class="title-text">TES KEMAMPUAN AKADEMIK</div>
    </div>

    <div class="calendar">
      <div class="cal-label" id="dayName">HARI</div>
      <div class="date" id="dateNum">23</div>
      <div class="monthyear" id="monthYear">SEPTEMBER 2026</div>
    </div>
  </header>

  <main class="board">
    <div class="board-label">TOKEN</div>
    <div class="letters" id="letters"></div>
    <div class="size-control">
      <span class="size-label">SIZE</span>
      <button type="button" class="size-btn" id="sizeUp" title="Perbesar" aria-label="Perbesar huruf">▲</button>
      <button type="button" class="size-btn" id="sizeDown" title="Perkecil" aria-label="Perkecil huruf">▼</button>
    </div>
  </main>
</div>

<script>
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let displayed = [];
let letterScale = 1.75;
const MIN_SCALE = 0.55, MAX_SCALE = 1.75, SCALE_STEP = 0.1;

const DRAIN_MS = 15 * 60 * 1000; // 15 menit
let drainStart = null;
let drainRaf = null;

/* Hourly chime */
const chimeAudio = new Audio("chime.mp3");
chimeAudio.preload = "auto";
let lastChimeHour = -1;

function checkHourlyChime(){
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  // tepat di menit 0 dan detik 0–1, sekali per jam
  if(m === 0 && s < 2 && lastChimeHour !== h){
    lastChimeHour = h;
    try{
      chimeAudio.currentTime = 0;
      chimeAudio.play().catch(()=>{});
    }catch(e){}
  }
}

function randomLetters(){
  displayed = Array.from({length:6},()=>alphabet[Math.floor(Math.random()*26)]);
  renderLetters();
}

function renderLetters(){
  const box = document.getElementById("letters");
  const wasActive = drainStart !== null;
  const waterPct = wasActive ? getWaterPct() : 100;
  box.innerHTML = "";
  displayed.forEach((ch,i)=>{
    const el = document.createElement("div");
    el.className = "letter" + (wasActive ? " water-active" : "");
    el.textContent = ch;
    el.style.animationDelay = (i*0.03)+"s";
    if(wasActive) el.style.setProperty("--water", waterPct + "%");
    box.appendChild(el);
  });
}

function getWaterPct(){
  if(drainStart === null) return 100;
  const elapsed = Date.now() - drainStart;
  return Math.max(0, 100 * (1 - elapsed / DRAIN_MS));
}

function applyWaterLevel(){
  const pct = getWaterPct();
  document.querySelectorAll(".letter").forEach(el=>{
    el.style.setProperty("--water", pct + "%");
  });
  if(pct <= 0){
    stopDrain();
    document.querySelectorAll(".letter").forEach(el=>{
      el.classList.remove("water-active");
      el.style.removeProperty("--water");
    });
  }
}

function drainTick(){
  applyWaterLevel();
  if(drainStart !== null){
    drainRaf = requestAnimationFrame(drainTick);
  }
}

function startDrain(){
  if(drainRaf) cancelAnimationFrame(drainRaf);
  drainStart = Date.now();
  document.querySelectorAll(".letter").forEach(el=>{
    el.classList.add("water-active");
    el.style.setProperty("--water", "100%");
  });
  drainRaf = requestAnimationFrame(drainTick);
}

function stopDrain(){
  if(drainRaf) cancelAnimationFrame(drainRaf);
  drainRaf = null;
  drainStart = null;
}

function addLetter(ch){
  displayed.shift();
  displayed.push(ch);
  renderLetters();
}

function setLetterScale(s){
  letterScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));
  document.documentElement.style.setProperty("--letter-scale", letterScale);
}
function enlargeLetters(){ setLetterScale(letterScale + SCALE_STEP); }
function shrinkLetters(){ setLetterScale(letterScale - SCALE_STEP); }

document.getElementById("sizeUp").onclick = enlargeLetters;
document.getElementById("sizeDown").onclick = shrinkLetters;

document.addEventListener("keydown", e=>{
  if(e.ctrlKey||e.altKey||e.metaKey) return;

  if(e.key === "Enter"){
    e.preventDefault();
    startDrain();
    return;
  }

  const key = e.key.toUpperCase();
  if(alphabet.includes(key)){
    e.preventDefault();
    addLetter(key);
    return;
  }
  if(e.key === "ArrowUp"){ e.preventDefault(); enlargeLetters(); }
  else if(e.key === "ArrowDown"){ e.preventDefault(); shrinkLetters(); }
});

function polar(cx,cy,r,deg){
  const a=(deg-90)*Math.PI/180;
  return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)};
}
function buildAnalogFace(){
  const ticks=document.getElementById("clockTicks");
  const nums=document.getElementById("clockNumbers");
  for(let i=0;i<60;i++){
    const angle=i*6;
    const outer=polar(50,50,43.8,angle);
    const inner=polar(50,50,i%5===0?39:41.2,angle);
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",inner.x.toFixed(2));
    line.setAttribute("y1",inner.y.toFixed(2));
    line.setAttribute("x2",outer.x.toFixed(2));
    line.setAttribute("y2",outer.y.toFixed(2));
    line.setAttribute("class",i%5===0?"tick major":"tick minor");
    ticks.appendChild(line);
  }
  for(let n=1;n<=12;n++){
    const p=polar(50,50,34,n*30);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",p.x.toFixed(2));
    t.setAttribute("y",p.y.toFixed(2));
    t.setAttribute("class","clock-number");
    t.textContent=String(n);
    nums.appendChild(t);
  }
}

function setHand(id,deg){
  document.getElementById(id).style.transform=`rotate(${deg}deg)`;
}

function updateClock(){
  const now=new Date();
  const s=now.getSeconds()+now.getMilliseconds()/1000;
  const m=now.getMinutes()+s/60;
  const h=(now.getHours()%12)+m/60;
  setHand("secondHand",s*6);
  setHand("minuteHand",m*6);
  setHand("hourHand",h*30);
  document.getElementById("digitalClock").textContent=
    String(now.getHours()).padStart(2,"0")+":"+
    String(now.getMinutes()).padStart(2,"0")+":"+
    String(now.getSeconds()).padStart(2,"0");
}

const months=["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
const days=["MINGGU","SENIN","SELASA","RABU","KAMIS","JUMAT","SABTU"];
function updateDate(){
  const now=new Date();
  document.getElementById("dayName").textContent=days[now.getDay()];
  document.getElementById("dateNum").textContent=String(now.getDate()).padStart(2,"0");
  document.getElementById("monthYear").textContent=months[now.getMonth()]+" "+now.getFullYear();
}

randomLetters();
buildAnalogFace();
updateDate();
updateClock();
setLetterScale(letterScale);
setInterval(updateClock,50);
setInterval(updateDate,1000);
setInterval(checkHourlyChime,500);
</script>
</body>
</html>
