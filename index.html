<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackboard Letter Display</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{
    background:#e8e4d9;
    font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;
    color:#252525;
  }

  .stage{
    width:100vw;
    height:100vh;
    aspect-ratio:16/9;
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding:2.2vh 2.2vw 2vh;
    position:relative;
  }

  /* subtle hand-drawn / pen-stroke look */
  .stage:before{
    content:"";
    position:absolute;inset:0;
    pointer-events:none;
    opacity:.15;
    background:
      repeating-linear-gradient(7deg,transparent 0 9px,rgba(30,30,30,.05) 10px 11px),
      repeating-linear-gradient(-9deg,transparent 0 13px,rgba(255,255,255,.05) 14px 15px);
  }

  .topbar{
    height:18%;
    display:grid;
    grid-template-columns:1fr 3fr 1fr;
    align-items:center;
    gap:1.5vw;
    position:relative;
    z-index:2;
  }

  .clock-wrap,.calendar{
    height:90%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* REDESIGNED ANALOG WATCH FACE
     - exactly one outer circle
     - SVG is used so the ring, ticks, numerals and hands share one coordinate system
     - no pseudo-element creates a second circle
  */
  .clock{
    width:min(10.5vw,138px);
    aspect-ratio:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-1deg);
    filter:drop-shadow(3px 4px 0 rgba(37,37,37,.18));
  }

  .analog-face{
    width:100%;
    height:100%;
    display:block;
    overflow:visible;
  }

  .face-ring{
    fill:#f1ead7;
    stroke:#252525;
    stroke-width:3.2;
    vector-effect:non-scaling-stroke;
  }

  .face-inner{
    fill:none;
    stroke:#252525;
    stroke-width:1;
    opacity:.18;
    vector-effect:non-scaling-stroke;
  }

  .tick{
    stroke:#252525;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
  }

  .tick.major{stroke-width:2.1}
  .tick.minor{stroke-width:1;opacity:.72}

  .clock-number{
    fill:#252525;
    font-family:Arial,sans-serif;
    font-size:8.5px;
    font-weight:900;
    text-anchor:middle;
    dominant-baseline:middle;
  }

  .clock-hand{
    transform-origin:50px 50px;
    transform-box:view-box;
  }

  .hour-hand{
    stroke:#252525;
    stroke-width:4;
    stroke-linecap:round;
  }

  .minute-hand{
    stroke:#252525;
    stroke-width:2.5;
    stroke-linecap:round;
  }

  .second-hand{
    stroke:#555;
    stroke-width:1.35;
    stroke-linecap:round;
  }

  .hand-tail{
    stroke:#252525;
    stroke-width:2.5;
    stroke-linecap:round;
  }

  .center-ring{
    fill:#f1ead7;
    stroke:#252525;
    stroke-width:1.8;
  }

  .center-dot{
    fill:#252525;
  }

  .title{
    text-align:center;
    font-size:clamp(15px,2vw,29px);
    font-weight:900;
    letter-spacing:.12em;
    text-transform:uppercase;
    transform:rotate(-.5deg);
  }
  .digital-clock{
    display:inline-block;
    color:#c91515;
    font-family:"DSEG7-Classic","Courier New",monospace;
    font-size:clamp(22px,3vw,44px);
    line-height:1;
    letter-spacing:.06em;
    margin-bottom:.35em;
    text-shadow:0 0 2px rgba(201,21,21,.25);
  }
  .title span{
    display:inline-block;
    border-bottom:3px solid #252525;
    padding:0 .7em .15em;
  }

  .calendar{
    flex-direction:column;
    font-weight:900;
    transform:rotate(1deg);
  }
  .cal-label{font-size:clamp(10px,1vw,15px);letter-spacing:.16em}
  .date{font-size:clamp(22px,3vw,42px);line-height:1}
  .monthyear{font-size:clamp(11px,1.25vw,18px);letter-spacing:.06em}

  .board{
    flex:1;
    min-height:0;
    background:
      radial-gradient(circle at 20% 30%,rgba(255,255,255,.045),transparent 25%),
      radial-gradient(circle at 75% 70%,rgba(255,255,255,.035),transparent 22%),
      #202d29;
    border:clamp(5px,.55vw,9px) solid #6d5237;
    border-radius:8px;
    box-shadow:
      inset 0 0 0 3px #9a7750,
      inset 0 0 35px rgba(0,0,0,.55),
      6px 8px 0 rgba(37,37,37,.18);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .board:before{
    content:"";
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(0deg,transparent 0 8px,rgba(255,255,255,.025) 9px 10px),
      repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.025) 13px 14px);
    pointer-events:none;
  }
  .board-label{
    position:absolute;
    top:3.5%;
    left:3%;
    color:#d7d8ce;
    font-size:clamp(9px,.9vw,14px);
    letter-spacing:.18em;
    opacity:.72;
    transform:rotate(-1deg);
  }

  .letters{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px,2.2vw,38px);
    width:90%;
    position:relative;
    z-index:1;
  }
  .letter{
    width:clamp(55px,8vw,145px);
    aspect-ratio:.78;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f1eee1;
    font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive;
    font-size:clamp(50px,7.2vw,125px);
    font-weight:900;
    text-shadow:
      1px 1px 0 rgba(255,255,255,.18),
      -1px 0 0 rgba(255,255,255,.12),
      0 0 2px rgba(255,255,255,.28);
    position:relative;
    transform:rotate(-1deg);
  }
  .letter:nth-child(2){transform:rotate(1.2deg)}
  .letter:nth-child(3){transform:rotate(-1.8deg)}
  .letter:nth-child(4){transform:rotate(.8deg)}
  .letter:nth-child(5){transform:rotate(-.6deg)}
  .letter:nth-child(6){transform:rotate(1.5deg)}
  .letter:after{
    content:"";
    position:absolute;
    width:80%;height:6px;
    left:10%;bottom:8%;
    background:rgba(255,255,255,.1);
    transform:rotate(-2deg);
    filter:blur(1px);
  }

  .keyboard-area{
    height:14%;
    padding-top:1.2vh;
    position:relative;
    z-index:2;
  }
  .keyboard{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:row;
    justify-content:center;
    align-items:center;
    gap:.45vw;
    background:#d8d1bf;
    border:3px solid #333;
    border-radius:9px;
    padding:1vh 1vw;
    box-shadow:4px 5px 0 rgba(37,37,37,.18);
    transform:rotate(-.15deg);
  }
  .keyrow{
    display:grid;
    grid-template-columns:repeat(26,1fr);
    gap:.35vw;
    width:100%;
    height:100%;
  }
  .keyrow.r2,.keyrow.r3{display:none}
  button{
    appearance:none;
    border:2px solid #252525;
    background:#eee9da;
    color:#222;
    border-radius:5px;
    font-family:"Comic Sans MS","Segoe Print",cursive;
    font-size:clamp(9px,1.05vw,17px);
    font-weight:900;
    cursor:pointer;
    box-shadow:2px 3px 0 #252525;
    transform:rotate(-.4deg);
    transition:.08s;
  }
  button:nth-child(even){transform:rotate(.4deg)}
  button:hover{background:#fff9e9}
  button:active{transform:translate(2px,3px);box-shadow:0 0 0 #252525}

  .hint{
    position:absolute;
    bottom:.6%;
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(8px,.75vw,12px);
    letter-spacing:.12em;
    opacity:.6;
    white-space:nowrap;
  }

  @media(max-width:900px){
    .clock{width:9vw}
    .stage{padding:1vh 1vw}
    .topbar{height:16%}
    .clock{width:9vw}
    .keyboard-area{height:31%}
  }
  /* DSEG7-compatible embedded-style display. The page is standalone;
     DSEG7-Classic is requested first, with a seven-segment monospace fallback. */
</style>
</head>
<body>
<div class="stage">
  <header class="topbar">
    <div class="clock-wrap">
      <div class="clock" aria-label="Jam analog realtime">
        <svg class="analog-face" viewBox="0 0 100 100" role="img" aria-label="Jam analog realtime">
          <!-- One and only one outer watch circle -->
          <circle class="face-ring" cx="50" cy="50" r="47"></circle>
          <circle class="face-inner" cx="50" cy="50" r="42.5"></circle>

          <g id="clockTicks"></g>
          <g id="clockNumbers"></g>

          <!-- Hands -->
          <g id="hourHand" class="clock-hand">
            <line class="hour-hand" x1="50" y1="50" x2="50" y2="29"></line>
            <line class="hand-tail" x1="50" y1="50" x2="50" y2="54"></line>
          </g>

          <g id="minuteHand" class="clock-hand">
            <line class="minute-hand" x1="50" y1="50" x2="50" y2="20"></line>
            <line class="hand-tail" x1="50" y1="50" x2="50" y2="53"></line>
          </g>

          <g id="secondHand" class="clock-hand">
            <line class="second-hand" x1="50" y1="50" x2="50" y2="15"></line>
            <line class="second-hand" x1="50" y1="50" x2="50" y2="56"></line>
          </g>

          <circle class="center-ring" cx="50" cy="50" r="3.2"></circle>
          <circle class="center-dot" cx="50" cy="50" r="1.35"></circle>
        </svg>
      </div>
    </div>

    <div class="title">
      <div class="digital-clock" id="digitalClock">00:00:00</div>
      <span>TES KEMAMPUAN AKADEMIK</span>
    </div>

    <div class="calendar">
      <div class="cal-label" id="dayName">HARI</div>
      <div class="date" id="dateNum">23</div>
      <div class="monthyear" id="monthYear">SEPTEMBER 2026</div>
    </div>
  </header>

  <main class="board">
    <div class="board-label">TOKEN</div>
    <div class="letters" id="letters"></div>
    <div class="hint">CLICK THE LETTERS ON THE KEYBOARD</div>
  </main>

  <section class="keyboard-area">
    <div class="keyboard" aria-label="Keyboard A-Z">
      <div class="keyrow" id="row1"></div>
    </div>
  </section>
</div>

<script>
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let displayed = [];

function randomLetters(){
  displayed = Array.from({length:6},()=>alphabet[Math.floor(Math.random()*26)]);
  renderLetters();
}
function renderLetters(){
  const box=document.getElementById("letters");
  box.innerHTML="";
  displayed.forEach(ch=>{
    const el=document.createElement("div");
    el.className="letter";
    el.textContent=ch;
    box.appendChild(el);
  });
}

function makeKeyboard(){
  const row=document.getElementById("row1");
  row.innerHTML="";
  [...alphabet].forEach(ch=>{
    const b=document.createElement("button");
    b.type="button";
    b.textContent=ch;
    b.setAttribute("aria-label","Huruf "+ch);
    b.onclick=()=>{
      displayed.shift();
      displayed.push(ch);
      renderLetters();
    };
    row.appendChild(b);
  });
}

/* Build the analog watch face once.
   SVG coordinates keep every element aligned and prevent accidental double rings. */
function polar(cx,cy,r,angleDeg){
  const a=(angleDeg-90)*Math.PI/180;
  return {x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};
}

function buildAnalogFace(){
  const ticks=document.getElementById("clockTicks");
  const nums=document.getElementById("clockNumbers");

  for(let i=0;i<60;i++){
    const angle=i*6;
    const outer=polar(50,50,43.8,angle);
    const inner=polar(50,50,i%5===0?39.2:41.2,angle);

    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",inner.x.toFixed(2));
    line.setAttribute("y1",inner.y.toFixed(2));
    line.setAttribute("x2",outer.x.toFixed(2));
    line.setAttribute("y2",outer.y.toFixed(2));
    line.setAttribute("class",i%5===0?"tick major":"tick minor");
    ticks.appendChild(line);
  }

  for(let n=1;n<=12;n++){
    const p=polar(50,50,34.5,n*30);
    const text=document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x",p.x.toFixed(2));
    text.setAttribute("y",p.y.toFixed(2));
    text.setAttribute("class","clock-number");
    text.textContent=String(n);
    nums.appendChild(text);
  }
}

function setHand(id,deg){
  document.getElementById(id).style.transform=`rotate(${deg}deg)`;
}

/* Realtime analog clock */
function updateClock(){
  const now=new Date();
  const s=now.getSeconds()+now.getMilliseconds()/1000;
  const m=now.getMinutes()+s/60;
  const h=(now.getHours()%12)+m/60;

  setHand("secondHand",s*6);
  setHand("minuteHand",m*6);
  setHand("hourHand",h*30);

  document.getElementById("digitalClock").textContent =
    String(now.getHours()).padStart(2,"0")+":"+
    String(now.getMinutes()).padStart(2,"0")+":"+
    String(now.getSeconds()).padStart(2,"0");
}

/* Realtime calendar */
const months=["JANUARI","FEBRUARI","MARET","APRIL","MEI","JUNI","JULI","AGUSTUS","SEPTEMBER","OKTOBER","NOVEMBER","DESEMBER"];
const days=["MINGGU","SENIN","SELASA","RABU","KAMIS","JUMAT","SABTU"];
function updateDate(){
  const now=new Date();
  document.getElementById("dayName").textContent=days[now.getDay()];
  document.getElementById("dateNum").textContent=String(now.getDate()).padStart(2,"0");
  document.getElementById("monthYear").textContent=months[now.getMonth()]+" "+now.getFullYear();
}

makeKeyboard();
randomLetters();
buildAnalogFace();
updateDate();
updateClock();
setInterval(updateClock,50);
setInterval(updateDate,1000);
</script>
</body>
</html>
